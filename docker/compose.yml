# Vantaloom 团队版 · docker compose 示例
#
#   docker compose up -d      启动
#   docker compose logs -f    看日志（首次启动的引导信息在这里）
#   docker compose down       停止（数据在具名卷里，不会丢）
#
# 完整说明见 docs/docker-deployment.md。

services:
  vantaloom:
    # 版本请钉死，不要用 :latest —— 团队里每个人拉到的东西必须是同一个。
    image: ghcr.io/vantaloom/vantaloom:0.15.16
    container_name: vantaloom
    restart: unless-stopped

    ports:
      # 左边是宿主端口，右边是容器内端口（容器内端口不要改，健康检查与
      # 反代示例都按 8780 写的；要换对外端口只改左边）。
      #
      # 直接对公网开放请务必在前面放一层 HTTPS 反代：会话 cookie 的 Secure 位
      # 依赖 HTTPS，明文 HTTP 下密码与会话令牌是裸奔的。
      # 只想本机/内网访问时，把左边写成 "127.0.0.1:8780" 更稳妥。
      - "8780:8780"

    volumes:
      # 具名卷：对话、工程、账号、模型渠道、插件、日志全都在这里。
      # 换镜像升级不会动它；备份见部署文档「数据卷备份与迁移」。
      - vantaloom-data:/data

    environment:
      # ── 反代场景必填 ──────────────────────────────────────────────────
      # 反代把 Host 改写成 localhost / 上游名字时，运行时看到的 Host 与浏览器
      # 页面的 Origin 对不上，跨站写保护会把**正常请求**当成跨站攻击拒掉
      # （症状：页面能打开，一操作就 403）。把对外域名显式声明为可信来源即可。
      # 格式 = 完整 origin（协议 + 域名 [+ 非默认端口]），多个用英文逗号分隔，
      # 不支持通配符；改了要重启容器才生效。
      # - VANTALOOM_TRUSTED_ORIGIN=https://vtl.example.com

      # 对外访问地址。运行时**目前还没消费它**（见部署文档的运行时契约表），
      # 眼下只影响容器首次启动时日志里打印的引导地址。
      # - VANTALOOM_PUBLIC_BASE_URL=https://vtl.example.com

      # 容器默认 UTC。要本地时间就打开这行（镜像里装了 tzdata）。
      # - TZ=Asia/Shanghai

      # 多人协同由镜像强制开启，正常情况下不需要在这里配任何与身份相关的东西。
      # VANTALOOM_ALLOW_INSECURE=1 会关掉这道强制——除非你完全清楚代价，
      # 否则不要写它（等于把一个无认证的远程 shell 挂到网上）。
      - VANTALOOM_BIND_PORT=8780

    # docker stop 默认发 SIGTERM，而 vantaloom-api 只监听 SIGINT；镜像已用
    # STOPSIGNAL 指定 SIGINT，这里再留足收尾时间（run 中途停机要落盘）。
    stop_grace_period: 30s

    # 容器内的进程拿不到任何额外权限（agent 会在容器里跑任意命令，这一条便宜且值）。
    security_opt:
      - no-new-privileges:true

    # 资源上限：agent 可能同时跑构建、测试、多个子代理。按机器实际情况调整，
    # 不设上限的话一个失控的构建能把整台宿主机拖死。
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "4"
    #       memory: 8g

    # 健康检查已经写在镜像里（GET /v1/health），这里不用重复定义。

volumes:
  vantaloom-data:
