# ============================================================================
# 这个文件属于**公开仓** Vantaloom/Vantaloom-app，路径为
#   .github/workflows/build-docker.yml
# 发布时把它从私有仓的 docker/ci/build-docker.yml 复制过去（Dockerfile /
# entrypoint.sh / compose.yml 则复制到公开仓的 docker/ 目录）。
#
# 公开仓里没有、也永远不会有 Vantaloom 源码：这个 workflow 构建出的镜像，内容
# 100% 来自 npm 上已发布的编译产物 @vantaloom/runtime-linux-<arch>。构建机做的
# 只是「下载、解包、装进一个 Debian 基础镜像」——它没有源码，也不需要源码。
# 与安卓 libvantaloom.so、被控端 zip 同一条纪律。
# ============================================================================
name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "运行时版本（npm 上 @vantaloom/runtime-linux-x64 的版本号，例如 0.15.16）"
        required: true
        type: string
      push_latest:
        description: "同时推 :latest 标签"
        required: false
        default: true
        type: boolean
  push:
    tags:
      # 只认 docker-v* 这一种前缀。
      # 不要写成 "v*" 或不加过滤：公开仓的 APK / 被控端 / 桌面壳三个 workflow 每次
      # 发布都会自动创建 apk-build<run>-<sha> 之类的 tag，宽泛的过滤会让镜像在每次
      # 安卓发版时被重建一遍（版本还对不上）。
      - "docker-v*"

concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # 推 ghcr.io 用 GITHUB_TOKEN 即可，不需要额外配 secret

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 解析版本与镜像名
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/docker-v0.15.16 → 0.15.16
            VERSION="${GITHUB_REF_NAME#docker-v}"
            PUSH_LATEST=true
          else
            VERSION="${{ inputs.version }}"
            PUSH_LATEST="${{ inputs.push_latest }}"
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
            echo "必须给出具体版本号（不接受空值或 latest：镜像必须可复现）" >&2
            exit 1
          fi
          # ghcr 的仓库名必须全小写，而 GitHub 的 owner 可能带大写（Vantaloom）。
          OWNER="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/vantaloom"
          {
            echo "version=$VERSION"
            echo "image=$IMAGE"
            echo "push_latest=$PUSH_LATEST"
          } >> "$GITHUB_OUTPUT"
          echo "将构建 ${IMAGE}:${VERSION}（latest=${PUSH_LATEST}）"

      - name: 确认 npm 上存在该版本的运行时包
        run: |
          set -euo pipefail
          # 先问一句，省得跑完整个构建才发现版本号打错了。
          npm view "@vantaloom/runtime-linux-x64@${{ steps.meta.outputs.version }}" version \
            --registry https://registry.npmjs.org/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 架构说明 ────────────────────────────────────────────────────────────
      # 这里只构建 linux/amd64，因为 @vantaloom/runtime-linux-arm64 **在 npm 上不
      # 存在**（2026-07-27 核实：npm view 返回 404；packages/cli 的发布流程固定发
      # 三个平台 win32-x64 / darwin-arm64 / linux-x64）。凭空写上 arm64 只会得到
      # 一个必然失败的构建。
      #
      # 等 linux-arm64 运行时包发布之后，开启 arm64 只需要两步：
      #   1. 这一步的 platforms 改成 linux/amd64,linux/arm64
      #      （Dockerfile 已经按 TARGETARCH 选包，不用改）
      #   2. 冒烟测试那步改成「只测原生架构」：多架构构建无法 --load 到本地
      #      docker，届时改为先 push、再按 digest 拉回 amd64 那份来测。
      - name: 构建镜像（先加载到本地，冒烟通过再推）
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      # 冒烟测试是这条流水线里最有价值的一步：它会真的把容器跑起来。
      # 「二进制在这个基础镜像上跑不起来」「entrypoint 带了 CRLF」「数据目录权限
      # 不对」「身份层没有真正生效」这几类问题，只有真跑一次才会暴露。
      - name: 冒烟测试
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker run -d --name vtl-smoke -p 18780:8780 "$IMAGE"

          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18780/v1/health >/dev/null 2>&1; then ok=1; break; fi
            if [ -z "$(docker ps -q -f name=vtl-smoke)" ]; then
              echo "容器已退出：" >&2; docker logs vtl-smoke >&2 || true; exit 1
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "60 次重试后 /v1/health 仍不可用：" >&2; docker logs vtl-smoke >&2 || true; exit 1
          fi
          echo "健康检查通过：$(curl -fsS http://127.0.0.1:18780/v1/health)"

          # 身份层必须真的处于开启状态。这条断言就是 VANTALOOM_COLLAB_REQUIRED
          # 契约的验收：它红了，说明镜像里的运行时不认这个变量——那个镜像绝不能
          # 发出去（bind 0.0.0.0 + 无认证 = 一个公网可达的远程 shell）。
          BOOTSTRAP="$(curl -fsS http://127.0.0.1:18780/v1/collab/bootstrap)"
          echo "bootstrap: $BOOTSTRAP"
          case "$BOOTSTRAP" in
            *'"enabled":true'*) echo "身份层已强制开启" ;;
            *)
              echo "" >&2
              echo "身份层没有生效：/v1/collab/bootstrap 报 enabled≠true。" >&2
              echo "这个镜像里的运行时不认识 VANTALOOM_COLLAB_REQUIRED，禁止发布。" >&2
              docker logs vtl-smoke >&2 || true
              exit 1
              ;;
          esac

          # 未登录时受保护端点必须 401，而不是把数据吐出来。
          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18780/v1/agent/conversations)"
          if [ "$CODE" != "401" ]; then
            echo "未登录访问 /v1/agent/conversations 返回 $CODE，期望 401" >&2
            docker logs vtl-smoke >&2 || true
            exit 1
          fi
          echo "未认证访问被正确拒绝（401）"

          # 走一遍真实的首次初始化：这条路如果不通，容器就是个谁也进不去的砖头
          # （强制登录 + 一个账号都没有 = 鸡生蛋）。这一步同时验证了数据目录可写。
          INIT="$(curl -fsS -X POST http://127.0.0.1:18780/v1/collab/bootstrap/init \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke","displayName":"冒烟测试","password":"smoke-test-password-1"}')" || {
              echo "属主初始化失败：" >&2; docker logs vtl-smoke >&2 || true; exit 1; }
          TOKEN="$(printf '%s' "$INIT" | jq -r '.token // empty')"
          [ -n "$TOKEN" ] || { echo "初始化没有返回会话令牌：$INIT" >&2; exit 1; }
          echo "属主初始化成功"

          # 拿到令牌后受保护端点必须放行 —— 会话真的能用。
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:18780/v1/agent/conversations)"
          if [ "$CODE" != "200" ]; then
            echo "带令牌访问 /v1/agent/conversations 返回 $CODE，期望 200" >&2
            docker logs vtl-smoke >&2 || true
            exit 1
          fi
          echo "已认证访问正常（200）"

          # 初始化端点是一次性的：第二次必须被拒。
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:18780/v1/collab/bootstrap/init \
            -H 'Content-Type: application/json' \
            -d '{"username":"intruder","displayName":"x","password":"another-password-1"}')"
          if [ "$CODE" = "200" ]; then
            echo "初始化端点被第二次成功调用（应当只能成功一次）" >&2
            docker logs vtl-smoke >&2 || true
            exit 1
          fi
          echo "初始化端点已自我关闭（HTTP $CODE）"

          # 优雅停机：STOPSIGNAL=SIGINT 时 docker stop 应当很快返回，
          # 而不是等满 10s 超时被 SIGKILL 硬杀。
          START="$(date +%s)"
          docker stop vtl-smoke >/dev/null
          echo "停机耗时 $(( $(date +%s) - START ))s"

          docker rm -f vtl-smoke >/dev/null

      - name: 推送镜像
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}"
          VERSION="${{ steps.meta.outputs.version }}"
          docker push "${IMAGE}:${VERSION}"
          if [ "${{ steps.meta.outputs.push_latest }}" = "true" ]; then
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

      - name: 汇总
        run: |
          {
            echo "### 镜像已发布"
            echo ""
            echo '```'
            echo "docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo ""
            echo "架构：linux/amd64（arm64 待 @vantaloom/runtime-linux-arm64 发布后开启）"
          } >> "$GITHUB_STEP_SUMMARY"
